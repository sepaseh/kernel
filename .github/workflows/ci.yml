name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run audit

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      - run: npm run test:contract

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-contracts-${{ github.sha }}
          path: pacts
          retention-days: 14

      - name: Validate SonarQube configuration
        continue-on-error: true
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          missing=()

          [[ -z "$SONAR_HOST_URL" ]] && missing+=("SONAR_HOST_URL")
          [[ -z "$SONAR_PROJECT_KEY" ]] && missing+=("SONAR_PROJECT_KEY")
          [[ -z "$SONAR_TOKEN" ]] && missing+=("SONAR_TOKEN")

          if (( ${#missing[@]} > 0 )); then
            missing_list=$(IFS=,; echo "${missing[*]}")
            echo "::error title=Missing SonarQube configuration::Configure these repository settings: $missing_list"
            exit 1
          fi

      - name: SonarQube scan
        continue-on-error: true
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        with:
          args: -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}

      - run: npm run knip

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://api.example.com
      VITE_APP_BASE_URL: /
      VITE_RELEASE_ID: ${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run performance

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ github.sha }}
          path: dist

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci
          retention-days: 14

  e2e:
    needs: check
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://api.example.com
      VITE_APP_BASE_URL: /
      VITE_RELEASE_ID: ${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 14
