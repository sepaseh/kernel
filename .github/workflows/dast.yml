name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Authorized staging application URL
        required: true
        type: string
concurrency:
  cancel-in-progress: false
  group: staging-dast

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAST_ALLOWED_HOST: ${{ vars.STAGING_ALLOWED_APP_HOST }}
      DAST_PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      DAST_TARGET: ${{ inputs.target_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate authorized target
        run: node scripts/validate-workflow-targets.mjs dast

      - name: Run authorized ZAP full scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          allow_issue_writing: false
          artifact_name: staging-dast-${{ github.run_id }}
          cmd_options: "-a"
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:c558ee87358911ab17278c70991e856f57793e115d9cd0f88ca475cf82907a1a
          fail_action: true
          target: ${{ env.DAST_TARGET }}
