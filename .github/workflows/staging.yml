name: Staging validation

on:
  workflow_dispatch:
    inputs:
      application_url:
        description: Staging application base URL
        required: true
        type: string
      api_health_url:
        description: Staging API health endpoint
        required: true
        type: string

concurrency:
  cancel-in-progress: true
  group: staging-${{ inputs.application_url }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      STAGING_ALLOWED_API_HOST: ${{ vars.STAGING_ALLOWED_API_HOST }}
      STAGING_ALLOWED_APP_HOST: ${{ vars.STAGING_ALLOWED_APP_HOST }}
      STAGING_API_HEALTH_URL: ${{ inputs.api_health_url }}
      STAGING_BASE_URL: ${{ inputs.application_url }}

    steps:
      - name: Validate staging targets
        shell: bash
        run: |
          node -e '
            const parseConfiguredHostname = (name, rawValue) => {
              if (!rawValue || rawValue !== rawValue.trim()) {
                throw new Error(`${name} must be a hostname without whitespace`);
              }
              const normalized = rawValue.toLowerCase();
              const hostnamePattern =
                /^(?=.{1,253}$)(?!-)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
              if (!hostnamePattern.test(normalized)) {
                throw new Error(`${name} must contain a hostname only`);
              }
              const parsed = new URL(`https://${rawValue}`);
              if (parsed.hostname !== normalized) {
                throw new Error(`${name} must be a canonical hostname only`);
              }
              return parsed.hostname;
            };
            const parseTarget = (name, rawValue) => {
              if (!rawValue) throw new Error(`${name} is required`);
              const url = new URL(rawValue);
              if (url.protocol !== "https:") {
                throw new Error(`${name} must use HTTPS`);
              }
              if (url.username || url.password) {
                throw new Error(`${name} must not contain credentials`);
              }
              return url;
            };
            const appUrl = parseTarget("STAGING_BASE_URL", process.env.STAGING_BASE_URL);
            const apiUrl = parseTarget(
              "STAGING_API_HEALTH_URL",
              process.env.STAGING_API_HEALTH_URL,
            );
            const allowedAppHost = parseConfiguredHostname(
              "STAGING_ALLOWED_APP_HOST",
              process.env.STAGING_ALLOWED_APP_HOST,
            );
            const allowedApiHost = parseConfiguredHostname(
              "STAGING_ALLOWED_API_HOST",
              process.env.STAGING_ALLOWED_API_HOST,
            );
            if (appUrl.hostname !== allowedAppHost) {
              throw new Error("STAGING_BASE_URL host is not explicitly allowed");
            }
            if (apiUrl.hostname !== allowedApiHost) {
              throw new Error("STAGING_API_HEALTH_URL host is not explicitly allowed");
            }
          '

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:staging

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-validation-${{ github.run_id }}
          path: |
            playwright-report/staging
            test-results/staging
          retention-days: 14
