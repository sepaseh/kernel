name: Staging validation

on:
  workflow_dispatch:
    inputs:
      application_url:
        description: Staging application base URL
        required: true
        type: string
      api_health_url:
        description: Staging API health endpoint
        required: true
        type: string

concurrency:
  cancel-in-progress: true
  group: staging-${{ inputs.application_url }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      STAGING_API_HEALTH_URL: ${{ inputs.api_health_url }}
      STAGING_BASE_URL: ${{ inputs.application_url }}

    steps:
      - name: Validate staging targets
        run: |
          if [[ -z "$STAGING_BASE_URL" || -z "$STAGING_API_HEALTH_URL" ]]; then
            echo "STAGING_BASE_URL and STAGING_API_HEALTH_URL are required."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:staging

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-validation-${{ github.run_id }}
          path: |
            playwright-report/staging
            test-results/staging
          retention-days: 14
